
<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#290606"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Subtle Grid Overlay -->
  <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Brand Badge -->
  <rect x="60" y="50" width="220" height="36" rx="18" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.4"/>
  <text x="170" y="73" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle">SALIMI DIGITAL (SD)</text>

  <!-- Title & Subtitle -->
  <text x="60" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#ffffff">Rouqi Luxury Perfumes Store</text>
  <text x="60" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="bold" fill="#fbbf24">عطور الروقي الفاخرة</text>
  <text x="60" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#cbd5e1">Exclusive oriental & western fragrance e-commerce store with interactive scent finder, not...</text>

  <!-- Footer Badges -->
  <text x="60" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8">Developer: Engineer Mohammed Al Salimi  |  Brand: Salimi Tech</text>
  <text x="1140" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#fbbf24" text-anchor="end">sd-04-rouqi-perfumes</text>

  <!-- Accent Line -->
  <rect x="60" y="360" width="1080" height="4" rx="2" fill="url(#accent)"/>
</svg>
